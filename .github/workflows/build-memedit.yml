name: Build memedit

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf

      - name: Compile memedit
        run: |
          arm-linux-gnueabihf-gcc -static -o memedit memedit.c

      - name: Upload memedit
        uses: actions/upload-artifact@v4
        with:
          name: memedit
          path: memedit
